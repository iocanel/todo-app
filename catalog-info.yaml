
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: todo-app
  description: A cool quarkus app
  annotations:
    argocd/app-name: todo-app-bootstrap
    backstage.io/kubernetes-id: todo-app
    # It must be commented otherwise we cannot see the Tekton pipelines resources
    # backstage.io/kubernetes-namespace: iocanel
    backstage.io/source-location: url:https://github.com/iocanel/todo-app
    # The janus-idp.io/tekton allows to set the boolean value: isTektonCIAvailable which is used within the UI to enable/disable the TektonCIComponent
    janus-idp.io/tekton: todo-app
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: iocanel/
    # See: topology annotation: https://github.com/janus-idp/backstage-plugins/tree/main/plugins/topology
    app.kubernetes.io/name: quarkus
    app.quarkus.io/quarkus-version: 3.23.3
  tags:
    - java
    - quarkus
  links:
    - url: https://todo-app-iocanel.apps.qshift.snowdrop.dev/
      title: Quarkus application url
      icon: web
spec:
  type: service
  lifecycle: production
  owner: user:guest
  providesApis: [todo-app-api]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: todo-app-api
  description: A cool quarkus app
spec:
  type: openapi
  lifecycle: production
  owner: user:guest
  definition: 
    $text: openapi.yaml
